# 关注股池示例 —— 复制成 config/watchlist.yaml 后修改
# Skill 会在每日报告里扫描这里的股票，产生信号时提醒
#
# 股票代码用 6 位数字（沪市通常 600/601/603/605/688，深市 000/001/002/300）
# 下面这些只是示例，不是推荐！skill 也不保证这些票未来会涨

symbols:
  # 白酒
  - "600519"  # 贵州茅台
  - "000858"  # 五粮液
  - "600809"  # 山西汾酒

  # 新能源
  - "300750"  # 宁德时代
  - "002594"  # 比亚迪
  - "601012"  # 隆基绿能

  # 银行 / 保险（低波动压舱石）
  - "601398"  # 工商银行
  - "601318"  # 中国平安

  # 科技
  - "000063"  # 中兴通讯

  # 医药
  - "600276"  # 恒瑞医药

# 按用途分组可选
groups:
  core:                     # 核心仓位，长期持有
    - "600519"
    - "601398"
    - "600276"
  tactical:                 # 战术仓位，择时交易
    - "300750"
    - "002594"
    - "000063"

# 每只股票可以附加备注（LLM 会参考）
notes:
  "600519": "消费龙头，看长期持有"
  "300750": "新能源核心标的，波动大，严格止损"
  "601398": "防御性，股息 + 估值修复逻辑"
